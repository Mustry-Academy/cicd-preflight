name: CI

# A preflight repo for a CI/CD course should practise what it preaches:
# syntax-check and lint the shell on every push/PR. shellcheck is pinned to a
# fixed version so the result is reproducible and doesn't drift with whatever
# the runner image happens to ship.

on:
  push:
    branches: [main]
  pull_request:

env:
  SHELLCHECK_VERSION: v0.10.0

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: bash -n scripts/preflight.sh

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck
        run: shellcheck scripts/*.sh
