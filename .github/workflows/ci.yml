name: CI

# A preflight repo for a CI/CD course should practise what it preaches.
# Lint the shell on every push/PR so the script (and its docs, see the
# readme-in-sync job added later) can't silently rot.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: bash -n scripts/preflight.sh

      - name: shellcheck
        # shellcheck ships preinstalled on GitHub's ubuntu runners.
        run: shellcheck scripts/*.sh

  readme-sync:
    name: README table in sync with manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the checks table from the manifest
        run: bash scripts/update-readme.sh

      - name: Fail if README.md is out of date
        # If regenerating changed anything, the manifest and docs have drifted —
        # the contributor needs to run scripts/update-readme.sh and commit.
        run: git diff --exit-code README.md
